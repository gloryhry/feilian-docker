name: ${PROJECT_NAME:-feilian}

# Advanced opt-in. Ports bindings do NOT protect a macvlan LAN address.
# config.py requires a TLS/auth/source-ACL management path before startup.
services:
  feilian:
    image: ${IMAGE_REF:?Use run.sh or load the validated configuration first}
    hostname: feilian
    init: true
    restart: unless-stopped
    stop_grace_period: ${STOP_TIMEOUT:-20}s
    shm_size: 256m
    labels:
      io.feilian.project: ${PROJECT_NAME:-feilian}
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - SETGID
      - SETUID
      - SETPCAP
      - NET_BIND_SERVICE
      - NET_RAW
      - SYS_CHROOT
      - MKNOD
      - AUDIT_WRITE
      - SETFCAP
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      FEILIAN_NETWORK_MODE: macvlan
      GUI_MODE: ${GUI_MODE:-vnc}
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1600x1000x24}
      VNC_PASSWORD_FILE: ${VNC_PASSWORD_FILE:-}
      NOVNC_BIND: 0.0.0.0
      NOVNC_PORT: ${NOVNC_INTERNAL_PORT:-6080}
      NOVNC_INTERNAL_PORT: ${NOVNC_INTERNAL_PORT:-6080}
      WEB_AUTH: "1"
      WEB_TLS: ${WEB_TLS:?macvlan requires TLS}
      WEB_SOURCE_CIDRS: ${WEB_SOURCE_CIDRS:?macvlan requires source ACL}
      WEB_AUTH_FILE: ${WEB_AUTH_FILE:-}
      WEB_TLS_CERT_FILE: ${WEB_TLS_CERT_FILE:-}
      WEB_TLS_KEY_FILE: ${WEB_TLS_KEY_FILE:-}
      START_NETWORKMANAGER: ${START_NETWORKMANAGER:-1}
      START_SERVICE: ${START_SERVICE:-1}
      START_GUI: ${START_GUI:-1}
    volumes:
      - feilian-home:/home/feilian
      - feilian-root:/root
      - feilian-logs:/var/log/feilian
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      feilian-macvlan:
        ipv4_address: ${MACVLAN_IP:?explicit free macvlan IPv4 address required}

volumes:
  feilian-home:
  feilian-root:
  feilian-logs:

networks:
  feilian-macvlan:
    external: true
    name: ${PROJECT_NAME:-feilian}-macvlan
