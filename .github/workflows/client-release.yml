name: client-release

# Publishing is a deliberate human action: pushing a `release-v*` tag.
# The proprietary client image is built on native runners (no QEMU), pushed only
# to the PRIVATE package ghcr.io/<owner>/<repo>, and never tagged `latest`.
#
# Gates, in order:
#   1. tag must match release-v<client version>-<anything>
#   2. repository variable CLIENT_REDISTRIBUTION_APPROVED must not be "false"
#      (unset = allowed, because this repository exists to build this image for
#      its own owner; set it to "false" to freeze publishing instantly)
#   3. both native architecture builds must pass the official-client label check
on:
  push:
    tags:
      - "release-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Type publish to build AND push without a tag"
        required: false
        default: "no"

permissions:
  contents: read
  packages: write

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
      image: ${{ steps.gate.outputs.image }}
    steps:
      - name: Decide whether this run may publish
        id: gate
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VETO: ${{ vars.CLIENT_REDISTRIBUTION_APPROVED }}
          DISPATCH: ${{ inputs.publish }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/feilian-docker"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if [ "${VETO:-}" = "false" ]; then
            echo "CLIENT_REDISTRIBUTION_APPROVED=false vetoes publication" >&2
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            case "$REF_NAME" in
              release-v*) ;;
              *) echo "tag does not look like a release: $REF_NAME" >&2; exit 1 ;;
            esac
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${DISPATCH:-}" = "publish" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "no tag and no explicit publish input: build-only, nothing is pushed"
          fi

  build:
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch and verify the locked installer (never cached)
        run: |
          set -eu
          python3 scripts/client-artifacts.py validate --arch "${{ matrix.arch }}"
          python3 scripts/client-artifacts.py fetch --arch "${{ matrix.arch }}"

      - name: Build the exact platform image
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        run: |
          set -eu
          image="local/feilian:${GITHUB_SHA}-${{ matrix.arch }}"
          ./build.sh --platform "${{ matrix.platform }}" --image "$image"
          python3 - <<'PY'
          import json, os, subprocess, sys
          image = f"local/feilian:{os.environ['GITHUB_SHA']}-{os.environ['MATRIX_ARCH']}"
          labels = json.loads(subprocess.check_output(
              ["docker", "image", "inspect", "--format", "{{json .Config.Labels}}", image]))
          if labels.get("io.feilian.client.kind") != "official":
              sys.exit("refusing to publish a non-official client image")
          if labels.get("io.feilian.runtime.schema") != "1":
              sys.exit("runtime schema mismatch")
          print("labels verified:", sorted(labels))
          PY

      - name: Real-client no-account smoke (this runner architecture only)
        run: |
          set -eu
          image="local/feilian:${GITHUB_SHA}-${{ matrix.arch }}"
          docker rm -f fl-smoke >/dev/null 2>&1 || true
          docker run -d --name fl-smoke --network none \
            --security-opt no-new-privileges:true --cap-drop ALL --cap-add CHOWN \
            --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add FSETID --cap-add KILL \
            --cap-add SETGID --cap-add SETUID --cap-add SETPCAP --cap-add NET_BIND_SERVICE \
            --cap-add SYS_CHROOT --cap-add MKNOD --cap-add AUDIT_WRITE --cap-add SETFCAP \
            --cap-add NET_ADMIN --tmpfs /run:rw,size=32m --tmpfs /var/log/feilian:rw,size=32m \
            -e FEILIAN_NETWORK_MODE=bridge -e START_NETWORKMANAGER=0 -e START_GUI=0 \
            "$image"
          ok=0
          for _ in $(seq 1 24); do
            sleep 5
            if docker exec fl-smoke python3 /opt/feilian/runtime/supervisor.py health \
                 --state-dir /run/feilian; then ok=1; break; fi
          done
          docker logs fl-smoke | tail -20
          docker exec fl-smoke cat /run/feilian/status.json || true
          docker stop -t 25 fl-smoke >/dev/null 2>&1 || true
          docker rm -f fl-smoke >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "runtime did not become healthy" >&2; exit 1; }
          echo "runtime healthy; VPN readiness must still be false without an account"

      - name: Diagnose registry auth (no secret values printed)
        if: needs.gate.outputs.approved == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.gate.outputs.image }}
        run: |
          set -u
          echo "actor=${{ github.actor }} image=${IMAGE} token_len=${#GHCR_TOKEN}"
          echo "repository=$GITHUB_REPOSITORY event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            "https://ghcr.io/token?scope=repository%3A${GITHUB_REPOSITORY_OWNER}%2Ffeilian-docker%3Apull%2Cpush&service=ghcr.io")
          echo "token exchange http=${code}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || echo "LOGIN_FAILED rc=$?"

      - name: Push the platform image
        if: needs.gate.outputs.approved == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          src="local/feilian:${GITHUB_SHA}-${{ matrix.arch }}"
          dst="${{ needs.gate.outputs.image }}:${GITHUB_SHA}-${{ matrix.arch }}"
          docker tag "$src" "$dst"
          if ! docker push "$dst"; then
            echo "PUSH_FAILED" >&2
            docker image inspect "$dst" --format 'size={{.Size}}' >&2
            exit 1
          fi

  index:
    needs: [gate, build]
    if: needs.gate.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Compose the multi-architecture index
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.gate.outputs.image }}
        run: |
          set -eu
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="${GITHUB_REF_NAME#release-v}"
          docker buildx imagetools create \
            --tag "${IMAGE}:v${tag:-0.0.0}" \
            --tag "${IMAGE}:${GITHUB_SHA:0:12}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"

      - name: Record digests (deploy by digest, never latest)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.gate.outputs.image }}
        run: |
          set -eu
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA:0:12}" | tee index.txt
          grep -E 'Digest|Platform' index.txt
          echo "Package must stay private; anonymous pulls are expected to be denied."
