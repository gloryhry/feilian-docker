name: ${PROJECT_NAME:-feilian}

# Main mode. run.sh prepares and verifies the owned external bridge first.
services:
  feilian:
    image: ${IMAGE_REF:?Use run.sh or load the validated configuration first}
    hostname: feilian
    init: true
    restart: unless-stopped
    stop_grace_period: ${STOP_TIMEOUT:-20}s
    shm_size: 256m
    labels:
      io.feilian.project: ${PROJECT_NAME:-feilian}
    # Explicit compatibility budget, initially Docker defaults + NET_ADMIN.
    # G2 narrows this against real-client smoke; cap_add is not a full cap list.
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - SETGID
      - SETUID
      - SETPCAP
      - NET_BIND_SERVICE
      - NET_RAW
      - SYS_CHROOT
      - MKNOD
      - AUDIT_WRITE
      - SETFCAP
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - target: ${NOVNC_INTERNAL_PORT:-6080}
        published: "${NOVNC_HOST_PORT:-6080}"
        host_ip: ${WEB_BIND:-127.0.0.1}
        protocol: tcp
    environment:
      FEILIAN_NETWORK_MODE: bridge
      GUI_MODE: ${GUI_MODE:-vnc}
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1600x1000x24}
      VNC_PASSWORD_FILE: ${VNC_PASSWORD_FILE:-}
      NOVNC_BIND: 0.0.0.0
      NOVNC_PORT: ${NOVNC_INTERNAL_PORT:-6080}
      NOVNC_INTERNAL_PORT: ${NOVNC_INTERNAL_PORT:-6080}
      WEB_AUTH: ${WEB_AUTH:-1}
      WEB_TLS: ${WEB_TLS:-off}
      WEB_SOURCE_CIDRS: ${WEB_SOURCE_CIDRS:-}
      WEB_AUTH_FILE: ${WEB_AUTH_FILE:-}
      WEB_TLS_CERT_FILE: ${WEB_TLS_CERT_FILE:-}
      WEB_TLS_KEY_FILE: ${WEB_TLS_KEY_FILE:-}
      START_NETWORKMANAGER: ${START_NETWORKMANAGER:-1}
      START_SERVICE: ${START_SERVICE:-1}
      START_GUI: ${START_GUI:-1}
    volumes:
      - feilian-home:/home/feilian
      - feilian-root:/root
      - feilian-logs:/var/log/feilian
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - feilian-net

volumes:
  feilian-home:
  feilian-root:
  feilian-logs:

networks:
  feilian-net:
    external: true
    name: ${PROJECT_NAME:-feilian}-net
