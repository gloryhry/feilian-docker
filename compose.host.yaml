name: ${PROJECT_NAME:-feilian}

# Explicit compatibility mode only. This is NOT network isolation.
# Official FeiLian itself can alter the host netns; stopping need not undo it all.
# Managed proxy/DNS/gateway/MSS/guard are rejected by the configuration validator.
services:
  feilian:
    image: ${IMAGE_REF:?Use run.sh or load the validated configuration first}
    hostname: feilian
    init: true
    restart: unless-stopped
    stop_grace_period: ${STOP_TIMEOUT:-20}s
    shm_size: 256m
    network_mode: host
    labels:
      io.feilian.project: ${PROJECT_NAME:-feilian}
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - SETGID
      - SETUID
      - SETPCAP
      - NET_BIND_SERVICE
      - NET_RAW
      - SYS_CHROOT
      - MKNOD
      - AUDIT_WRITE
      - SETFCAP
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      FEILIAN_NETWORK_MODE: host
      GUI_MODE: ${GUI_MODE:-vnc}
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1600x1000x24}
      VNC_PASSWORD_FILE: ${VNC_PASSWORD_FILE:-}
      NOVNC_BIND: 127.0.0.1
      NOVNC_PORT: ${NOVNC_HOST_PORT:-6080}
      NOVNC_INTERNAL_PORT: ${NOVNC_HOST_PORT:-6080}
      WEB_AUTH: ${WEB_AUTH:-1}
      WEB_TLS: ${WEB_TLS:-off}
      WEB_AUTH_FILE: ${WEB_AUTH_FILE:-}
      WEB_TLS_CERT_FILE: ${WEB_TLS_CERT_FILE:-}
      WEB_TLS_KEY_FILE: ${WEB_TLS_KEY_FILE:-}
      PROXY_ENABLED: "0"
      DNS_MODE: "off"
      GUARD_ENABLED: "0"
      GATEWAY_ENABLED: "0"
      MSS_MODE: "off"
      PROJECT_NAME: ${PROJECT_NAME:-feilian}
      # --- enterprise network intent (empty means "not configured", never faked) ---
      CORP_DOMAINS: ${CORP_DOMAINS:-}
      CORP_CIDRS: ${CORP_CIDRS:-}
      VPN_DNS_SOURCE: ${VPN_DNS_SOURCE:-file}
      VPN_DNS: ${VPN_DNS:-}
      VPN_CONFIG_FILE: ${VPN_CONFIG_FILE:-/opt/apps/com.volcengine.feilian/files/vpn.conf}
      VPN_IFACE: ${VPN_IFACE:-auto}
      VPN_PROBE_DNS_NAME: ${VPN_PROBE_DNS_NAME:-}
      VPN_PROBE_URL: ${VPN_PROBE_URL:-}
      VPN_PROBE_EXPECT_STATUS: ${VPN_PROBE_EXPECT_STATUS:-200}
      VPN_PROBE_CA_FILE: ${VPN_PROBE_CA_FILE:-}
      # --- data plane ---
      PROXY_REQUIRE_VPN: ${PROXY_REQUIRE_VPN:-1}
      PROXY_BIND: ${PROXY_BIND:-127.0.0.1}
      PROXY_SOURCE_CIDRS: ${PROXY_SOURCE_CIDRS:-}
      PROXY_CONNECT_PORTS: ${PROXY_CONNECT_PORTS:-443}
      HTTP_PROXY_INTERNAL_PORT: ${HTTP_PROXY_INTERNAL_PORT:-8118}
      SOCKS_PROXY_INTERNAL_PORT: ${SOCKS_PROXY_INTERNAL_PORT:-1080}
      ACCESS_INTERFACE: ${ACCESS_INTERFACE:-eth0}
      # --- optional SNAT gateway / MSS ---
      GATEWAY_SOURCE_CIDRS: ${GATEWAY_SOURCE_CIDRS:-}
      ACCESS_SUBNET: ${ACCESS_SUBNET:-}
      GATEWAY_IP: ${GATEWAY_IP:-}
      START_NETWORKMANAGER: ${START_NETWORKMANAGER:-0}
      START_SERVICE: ${START_SERVICE:-1}
      START_GUI: ${START_GUI:-1}
    volumes:
      - feilian-home:/home/feilian
      - feilian-root:/root
      - feilian-logs:/var/log/feilian
      - feilian-secrets:/run/feilian-secrets:ro
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  feilian-home:
  feilian-root:
  feilian-logs:
  feilian-secrets:
    external: true
    name: ${PROJECT_NAME:-feilian}-secrets
